services:
  backend:
    build: ./backend
    container_name: cost-ontology-backend
    ports:
      - "8000:8000"
    environment:
      - COST_ONTOLOGY_DB=/data/cost_ontology.db
    volumes:
      - ontology-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cost-ontology-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ontology-data:
